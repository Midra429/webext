name: release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        required: true
        default: "patch"
        type: choice
        options: [major, minor, patch]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Node.jsをインストール
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Bunをインストール
        uses: oven-sh/setup-bun@v2

      - name: Gitのユーザーを設定
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: パッケージをビルド
        run: |
          bun install --frozen-lockfile
          bun run validate
          bun run build

      - name: package.jsonのexportsを更新
        run: |
          bun run scripts/generate-exports.ts
          if ! git diff --quiet package.json; then
            git add package.json
            git commit -m "Update exports"
          fi

      - name: バージョンを更新
        run: |
          bunx bumpp ${{ github.event.inputs.bump_type }} --commit "v%s" --yes
          echo VERSION=$(bun -e "console.log(require('./package.json').version)") >> $GITHUB_ENV

      - name: パッケージを公開
        run: npm publish

      - name: GitHubへリリース
        run: gh release create "v${VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
